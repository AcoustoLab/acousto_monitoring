name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-ni:host

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format
        run: uv run ruff format --check

      - name: Pyright
        run: uv run pyright

      - name: Tests
        run: uv run pytest
